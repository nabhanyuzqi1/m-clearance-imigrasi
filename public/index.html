<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Clearance ISam</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .search-form {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        /* Search Section */
        .search-section {
            margin-bottom: 30px;
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-header h2 {
            color: #333;
            font-size: 24px;
        }

        .user-type-toggle {
            display: flex;
            background: #f5f5f5;
            border-radius: 25px;
            padding: 5px;
        }

        .toggle-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .search-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input {
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select, .status-select {
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-count {
            color: #666;
        }

        .view-toggle {
            display: flex;
            background: #f5f5f5;
            border-radius: 25px;
            padding: 5px;
        }

        .view-toggle-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .view-toggle-btn.active {
            background: #667eea;
            color: white;
        }

        /* Document Cards */
        .document-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .document-card {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .document-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .ship-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-waiting { background: #fff3cd; color: #856404; }
        .status-revision { background: #d1ecf1; color: #0c5460; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-declined { background: #f8d7da; color: #721c24; }

        .card-info {
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-label {
            color: #666;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 1px solid #dee2e6;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Document Detail View */
        .document-detail {
            display: none;
            max-width: 800px;
            margin: 0 auto;
        }

        .detail-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .detail-title {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .detail-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .detail-content {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 15px;
            padding: 30px;
        }

        .info-section {
            margin-bottom: 30px;
        }

        .info-section h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
            text-align: right;
        }

        .documents-section {
            margin-top: 20px;
        }

        .document-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .document-link {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .document-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        /* Navigation */
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        /* Loading and Status */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            text-align: center;
            margin: 20px 0;
        }

        .loading {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-container {
                margin: 0;
                width: 100%;
                border-radius: 0;
                min-height: 100vh;
            }

            .search-form {
                grid-template-columns: 1fr;
            }

            .document-cards {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .card-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="logo">Loading...</div>
        <h1>M-Clearance ISam</h1>
        <p class="subtitle">Enter Short Link to Access Document</p>

        <form class="search-form" id="search-form">
            <input type="text" class="search-input" id="short-link-input" placeholder="Enter short link (e.g., mgn8gqsxrnn208)" autocomplete="off">
            <button type="submit" class="search-btn">Access Document</button>
        </form>

        <div id="loading" class="spinner" style="display: none;"></div>
        <div id="status" class="status loading" style="display: none;"></div>

        <div id="document-info" class="document-info" style="display: none;">
            <h3>Clearance Document</h3>
            <div class="info-item">
                <span class="label">Application ID:</span>
                <span class="value" id="app-id">Loading...</span>
            </div>
            <div class="info-item">
                <span class="label">Clearance Code:</span>
                <span class="value" id="clearance-code">Loading...</span>
            </div>
            <div class="info-item">
                <span class="label">Generated:</span>
                <span class="value" id="generated-date">Loading...</span>
            </div>
            <div class="info-item">
                <span class="label">Officer:</span>
                <span class="value" id="officer-name">Loading...</span>
            </div>
        </div>

        <a id="download-btn" href="#" class="document-link" style="display: none;">Download PDF</a>
    </div>

    <script type="module">
        // Load logo from Firebase Storage
        async function loadLogo() {
            try {
                const possiblePaths = [
                    'https://firebasestorage.googleapis.com/v0/b/m-clearance-imigrasi-sampit.appspot.com/o/app_logo%2Fisam_logo.png?alt=media&token=ad90a4f9-d613-43da-a067-dca6e3a0a9e2',
                    'https://firebasestorage.googleapis.com/v0/b/m-clearance-imigrasi-sampit.appspot.com/o/immigration_logo.png?alt=media&token=ad90a4f9-d613-43da-a067-dca6e3a0a9e2',
                    'https://firebasestorage.googleapis.com/v0/b/m-clearance-imigrasi-sampit.appspot.com/o/isam_logo.png?alt=media&token=ad90a4f9-d613-43da-a067-dca6e3a0a9e2',
                    'https://firebasestorage.googleapis.com/v0/b/m-clearance-imigrasi-sampit.appspot.com/o/logo.png?alt=media&token=ad90a4f9-d613-43da-a067-dca6e3a0a9e2'
                ];

                for (const logoUrl of possiblePaths) {
                    try {
                        console.log('Trying logo URL:', logoUrl);
                        const response = await fetch(logoUrl, { method: 'HEAD' });
                        if (response.ok) {
                            console.log('Found working logo URL:', logoUrl);
                            const blobResponse = await fetch(logoUrl);
                            const blob = await blobResponse.blob();
                            const logoElement = document.getElementById('logo');
                            logoElement.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                            logoElement.style.backgroundSize = 'contain';
                            logoElement.style.backgroundRepeat = 'no-repeat';
                            logoElement.textContent = '';
                            console.log('Logo loaded successfully from Firebase Storage');
                            return;
                        }
                    } catch (pathError) {
                        console.warn('Failed to load from path:', logoUrl, pathError.message);
                    }
                }

                throw new Error('No logo paths worked');
            } catch (error) {
                console.error('Failed to load logo from Firebase Storage:', error);
                // Keep text logo as fallback
            }
        }

        // Load logo immediately
        loadLogo();

        // Check URL for short link on page load
        checkUrlForShortLink();

        // Handle form submission
        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const shortLink = document.getElementById('short-link-input').value.trim();

            if (!shortLink) {
                showError('Please enter a short link');
                return;
            }

            resolveShortLink(shortLink);
        });

        // Handle Enter key in input field
        document.getElementById('short-link-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.form.dispatchEvent(new Event('submit'));
            }
        });

        async function resolveShortLink(shortLink) {
            showLoading('Looking up document...');

            try {
                // Call Firebase HTTP endpoint to resolve short URL
                const functionUrl = `https://asia-southeast1-m-clearance-imigrasi-sampit.cloudfunctions.net/resolveShortUrlHTTP?id=${encodeURIComponent(shortLink)}`;
                console.log('Calling function:', functionUrl);

                const response = await fetch(functionUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Function response:', data);

                    if (data.success && data.originalUrl) {
                        console.log('Redirecting to:', data.originalUrl);

                        // Show success and redirect immediately
                        showSuccess('Document found! Opening PDF...');

                        // Redirect immediately to PDF
                        window.location.href = data.originalUrl;
                    } else {
                        console.error('Invalid response format:', data);
                        showError('Document not found or expired');
                    }
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                console.error('Error calling function:', error);
                console.error('Error details:', {
                    message: error.message,
                    stack: error.stack,
                    shortLink: shortLink,
                    functionUrl: 'https://asia-southeast1-m-clearance-imigrasi-sampit.cloudfunctions.net/resolveShortUrlHTTP?id=' + encodeURIComponent(shortLink)
                });

                showError('Unable to load document. Please check your short link and try again.');
            }
        }

        function showLoading(message) {
            const loadingEl = document.getElementById('loading');
            const statusEl = document.getElementById('status');

            loadingEl.style.display = 'block';
            statusEl.style.display = 'block';
            statusEl.className = 'status loading';
            statusEl.textContent = message;
        }

        function showError(message) {
            const statusEl = document.getElementById('status');
            statusEl.style.display = 'block';
            statusEl.className = 'status error';
            statusEl.textContent = message;
            document.getElementById('loading').style.display = 'none';
        }

        function showSuccess(message) {
            const statusEl = document.getElementById('status');
            statusEl.style.display = 'block';
            statusEl.className = 'status success';
            statusEl.textContent = message;
            document.getElementById('loading').style.display = 'none';
        }

        function checkUrlForShortLink() {
            // Check if URL contains /s/ path with short link
            const urlPath = window.location.pathname;
            const shortLinkMatch = urlPath.match(/^\/s\/([a-zA-Z0-9]+)$/);

            if (shortLinkMatch) {
                const shortLink = shortLinkMatch[1];
                console.log('Found short link in URL:', shortLink);

                // Auto-fill the input field
                document.getElementById('short-link-input').value = shortLink;

                // Automatically resolve the short link
                resolveShortLink(shortLink);
            }
        }
    </script>
</body>
</html>
